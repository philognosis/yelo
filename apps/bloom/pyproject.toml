[project]
name = "bloom"
version = "1.0.0"
description = "Bloom Employee Evaluation & Growth Engine - AI-powered performance reviews"
authors = [
    {name = "Bloom Team", email = "team@bloom.ai"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "multi-agent", "performance-review", "evaluation", "hr-tech", "rag", "llm"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Async & Web
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",

    # Database Drivers
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "qdrant-client>=1.7.0",
    "neo4j>=5.16.0",
    "influxdb-client>=1.39.0",

    # AI & LLM
    "anthropic>=0.8.0",
    "openai>=1.6.0",
    "google-generativeai>=0.3.0",
    "tiktoken>=0.5.0",
    "sentence-transformers>=2.2.0",

    # Natural Language Processing
    "spacy>=3.7.0",
    "nltk>=3.8.0",

    # Security & Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Integrations
    "slack-sdk>=3.26.0",
    "slack-bolt>=1.18.0",
    "aiosmtplib>=3.0.1",
    "email-validator>=2.1.0",
    "google-auth>=2.26.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.110.0",
    "jira>=3.6.0",
    "PyGithub>=2.1.1",
    "python-gitlab>=4.2.0",

    # Utilities
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "orjson>=3.9.0",
    "python-dateutil>=2.8.0",

    # Data Science & Math
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.2.0",

    # Monitoring & Observability
    "prometheus-client>=0.19.0",
    "sentry-sdk[fastapi]>=1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "faker>=22.0.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
bloom = "bloom.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/yelo"
Documentation = "https://github.com/yourusername/yelo/tree/main/apps/bloom/docs"
Repository = "https://github.com/yourusername/yelo"
Issues = "https://github.com/yourusername/yelo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bloom"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "faker>=22.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["bloom"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
