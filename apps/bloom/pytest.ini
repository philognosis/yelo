[pytest]
# Pytest configuration for Bloom tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Paths
testpaths = tests

# Async support
asyncio_mode = auto

# Markers
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
    slow: mark test as slow running

# Coverage
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=bloom
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Ignore paths
norecursedirs = .git .tox dist build *.egg

# Timeout (10 minutes for async tests)
timeout = 600

# Logging
log_cli = true
log_cli_level = INFO
