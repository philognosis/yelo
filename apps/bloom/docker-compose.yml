services:
  # PostgreSQL Database (for DocumentStore in production)
  postgres:
    image: postgres:16
    container_name: bloom-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloom}
      POSTGRES_USER: ${POSTGRES_USER:-bloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloom_password}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloom-network

  # Redis (for caching and pub/sub)
  redis:
    image: redis:7-alpine
    container_name: bloom-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloom-network

  # Qdrant (for VectorStore)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bloom-qdrant
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloom-network

  # Neo4j (for GraphStore - optional)
  neo4j:
    image: neo4j:5-community
    container_name: bloom-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-bloom_neo4j_password}
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-bloom_neo4j_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloom-network
    profiles:
      - full

  # InfluxDB (for TimeSeriesStore - optional)
  influxdb:
    image: influxdb:2.7-alpine
    container_name: bloom-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-bloom}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-bloom_influxdb_password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-bloom}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-bloom_token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloom-network
    profiles:
      - full

  # Bloom API
  api:
    build:
      context: ../..  # Repository root for access to src/iras
      dockerfile: apps/bloom/Dockerfile
    container_name: bloom-api
    environment:
      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bloom}
      POSTGRES_USER: ${POSTGRES_USER:-bloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloom_password}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      # Neo4j (optional)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bloom_neo4j_password}

      # InfluxDB (optional)
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-bloom_token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-bloom}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Security
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24

      # Bloom Configuration
      BLOOM_ENV: ${BLOOM_ENV:-production}
      BLOOM_NUM_SCRIBES: ${BLOOM_NUM_SCRIBES:-2}
      BLOOM_NUM_CONTEXT_MINERS: ${BLOOM_NUM_CONTEXT_MINERS:-2}
      BLOOM_NUM_CHASERS: ${BLOOM_NUM_CHASERS:-1}
      BLOOM_ENABLE_AUTONOMOUS_MODE: ${BLOOM_ENABLE_AUTONOMOUS_MODE:-true}
      BLOOM_ENABLE_RAG: ${BLOOM_ENABLE_RAG:-true}
      BLOOM_ENABLE_VOICE_SYNTHESIS: ${BLOOM_ENABLE_VOICE_SYNTHESIS:-false}

      # LLM Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}

      # Integrations
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}

      # Calendar Integration
      GOOGLE_CALENDAR_CREDENTIALS: ${GOOGLE_CALENDAR_CREDENTIALS}

      # Jira Integration
      JIRA_URL: ${JIRA_URL}
      JIRA_USER: ${JIRA_USER}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}

      # Git Integration
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
    volumes:
      - ./uploads:/app/bloom/uploads
      - ./logs:/app/bloom/logs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bloom-network
    restart: unless-stopped

  # Bloom Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: bloom-dashboard
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_APP_NAME: Bloom
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NODE_ENV: production
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bloom-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: bloom-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - api
      - dashboard
    networks:
      - bloom-network
    restart: unless-stopped
    profiles:
      - nginx

networks:
  bloom-network:
    driver: bridge

volumes:
  app_postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  influxdb_data:
    driver: local
