[pytest]
# Pytest configuration for IRAS test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Test paths
testpaths = tests

# Async support
asyncio_mode = auto

# Markers
markers =
    asyncio: asynchronous test
    slow: slow running test (deselect with '-m "not slow"')
    integration: integration test
    unit: unit test
    database: database test
    communication: communication test

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when running with --cov)
[coverage:run]
source = iras
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Exclude from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
